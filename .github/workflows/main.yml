name: Get CityHeaven Count

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: '*/30 * * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run scraper
        run: node getcount.js

      - name: Commit count.json
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add count.json

          git commit -m "update count" || echo "No changes"

          git push
